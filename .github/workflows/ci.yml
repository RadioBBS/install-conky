# Version 1.3.0 – 2026-08-24 – CI fuer bash-Tests (Software-Standard 1.2.0).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Tests
        run: bash tests/test_install_conky.sh
