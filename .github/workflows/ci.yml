# install-conky – GitHub-Actions: Shell-Tests ohne Installation.
#
# Projekt:     install-conky
# Modul:       .github/workflows/ci.yml
# Version:     1.3.0
# Stand:       2026-08-23
# Abhaengig:   bash >= 4, apt, conky (Paket), Debian/Raspberry Pi OS
# Bezug:       requirements.txt (leer – kein Python)
# Lizenz:      MIT
# Upstream:    –
# Erstellt mit: Cursor Grok 4.6
# Autor:       (FFHB) / RadioBBS
#
# Historie
